name: Trakr Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: trakr-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: production-smoke (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: opportunity-discovery
            path: /api/a2mcp/recommend
          - suite: resume-benchmarking-optimization
            path: /api/a2mcp/recommend?service=resume-benchmarking-optimization
          - suite: resume-generation
            path: /api/a2mcp/recommend?service=resume-generation
    env:
      SMOKE_BASE_URL: https://trakr-production-c70e.up.railway.app
      TRAKR_SMOKE_SERVICE_PATH: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:x402:production
